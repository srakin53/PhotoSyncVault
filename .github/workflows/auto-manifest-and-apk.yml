name: Auto Generate Manifest & Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-photos-pages:
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GitHub Pages site with manifest.json
        run: |
          mkdir -p _site/photos
          cp -r app/src/main/assets/photos/* _site/photos/ 2>/dev/null || true
          python3 - << 'EOF'
          import json, os, urllib.parse
          photos_dir = "_site/photos"
          exts = (".jpg", ".jpeg", ".png", ".webp")
          files = sorted(f for f in os.listdir(photos_dir) if f.lower().endswith(exts))
          manifest = {
              "album": "PhotoSyncVault",
              "images": [
                  {"name": f, "url": f"photos/{urllib.parse.quote(f)}"}
                  for f in files
              ]
          }
          with open("_site/manifest.json", "w", encoding="utf-8") as fp:
              json.dump(manifest, fp, ensure_ascii=False, indent=2)
          print(f"Generated manifest.json with {len(files)} images.")
          EOF

      - name: Download built APK for direct link
        uses: actions/download-artifact@v4
        with:
          name: PhotoSyncVault-debug-apk
          path: _site

      - name: Rename APK for direct download
        run: mv _site/app-debug.apk _site/PhotoSyncVault.apk

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug testDebugUnitTest
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSyncVault-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
